# Builds the firmware on every push and pull request. A v* tag also publishes a GitHub Release
# with the full image (flash at 0x0), the app image (for /api/ota) and their SHA-256 sums.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "arg=-DPROJECT_VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          command: >-
            idf.py ${{ steps.ver.outputs.arg }} build &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin -o ../channelstv-${{ steps.ver.outputs.name }}-full.bin @flash_args &&
            cp channelstv.bin ../channelstv-${{ steps.ver.outputs.name }}-ota.bin

      - name: Checksums
        run: sha256sum channelstv-*-full.bin channelstv-*-ota.bin > SHA256SUMS && cat SHA256SUMS

      - name: Scan the images for private strings
        run: tools/scan-artifacts.sh channelstv-*-full.bin channelstv-*-ota.bin

      - uses: actions/upload-artifact@v4
        with:
          name: channelstv-${{ steps.ver.outputs.name }}
          path: |
            channelstv-*-full.bin
            channelstv-*-ota.bin
            SHA256SUMS

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag's CHANGELOG.md section (a pre-release such as v0.2.0-rc1 uses v0.2.0's), then
      # the full diff since the previous v* tag, or since the first commit.
      - name: Release notes
        run: |
          ver="${GITHUB_REF_NAME%%-*}"
          # "## v0.2.1", or "## v0.2.1 (2026-11-06)"
          awk -v h="## $ver" '$0 == h || index($0, h " ") == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "no CHANGELOG.md section for $ver" >&2; exit 1; fi
          # the last release (not an rc) before this tag, else the first commit
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$GITHUB_REF_NAME^" 2>/dev/null) ||
            prev=$(git rev-list --max-parents=0 HEAD | tail -1)
          printf '\n**Full diff:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          name: channelstv-${{ github.ref_name }}

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            channelstv-*-full.bin
            channelstv-*-ota.bin
            SHA256SUMS
